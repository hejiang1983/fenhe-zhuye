      window.addEventListener('click', function(e) {
        // 如果点击的不是按钮或其他已有的交互元素，则停止冒泡
        const interactiveElements = ['BUTTON', 'A', 'INPUT', 'SELECT', 'TEXTAREA'];
        const isInteractive = interactiveElements.includes(e.target.tagName) || 
                              e.target.closest('button, a, [onclick], .word-circle, .control-btn, .game-node, .v-btn, .ans-card');
        
        if (!isInteractive) {
          // 停止事件冒泡，防止壳框架捕获点击并触发翻页
          e.stopPropagation();
        }
      }, true); // 使用捕获阶段优先拦截

      // 2. 针对演示模式中可能的全局翻页监听进行二次保险
      document.addEventListener('pageShow', function() {
        // 确保每页加载后都重新声明阻止逻辑
        document.body.style.pointerEvents = 'auto';

      (function() {
        // 将 API 定义在全局 window 上，确保外部(如 showPage)可访问
        window.lushanAPI = {
          scene: null,
          camera: null,
          renderer: null,
          controls: null,
          animationId: null,

          toggleAns: (id) =&gt; {
            const el = document.getElementById('ans-' + id);
            if (el) el.classList.toggle('active');
          },

          setView: (type) =&gt; {
            if (!lushanAPI.camera || !lushanAPI.controls) return;
            let targetPos = type === 'front' ? { x: 0, y: 15, z: 45 } : 
                           (type === 'side' ? { x: 45, y: 15, z: 0 } : { x: 0, y: 35, z: 70 });
            anime({
              targets: lushanAPI.camera.position,
              x: targetPos.x, y: targetPos.y, z: targetPos.z,
              duration: 1500,
              easing: 'easeInOutQuad',
              update: () =&gt; { 
                lushanAPI.camera.lookAt(0, 0, 0); 
                lushanAPI.controls.update(); 
              }
            });
          },

          destroy: () =&gt; {
            if (window.lushanAPI.animationId) cancelAnimationFrame(window.lushanAPI.animationId);
            if (window.lushanAPI.renderer) {
              window.lushanAPI.renderer.dispose();
              if (window.lushanAPI.renderer.domElement &amp;&amp; window.lushanAPI.renderer.domElement.parentElement) {
                window.lushanAPI.renderer.domElement.parentElement.removeChild(window.lushanAPI.renderer.domElement);
              }
            }
            window.lushanAPI.scene = null;
            window.lushanAPI.camera = null;
            window.lushanAPI.renderer = null;
            window.lushanAPI.controls = null;
          },

          init: () =&gt; {
            console.log(&quot;DEBUG: Lushan API Init start...&quot;);
            const container = document.getElementById('lushan-view-stage');
            if (!container) {
              console.error(&quot;DEBUG: Container #lushan-view-stage not found in DOM.&quot;);
              return;
            }
            
            window.lushanAPI.destroy();
            
            const width = container.clientWidth || 500;
            const height = container.clientHeight || 420;

            window.lushanAPI.scene = new THREE.Scene();
            window.lushanAPI.scene.background = new THREE.Color(0xf0f4f8);

            window.lushanAPI.camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
            window.lushanAPI.camera.position.set(0, 15, 30);

            window.lushanAPI.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
            window.lushanAPI.renderer.setSize(width, height);
            window.lushanAPI.renderer.setPixelRatio(window.devicePixelRatio || 1);
            container.appendChild(window.lushanAPI.renderer.domElement);

            window.lushanAPI.scene.add(new THREE.AmbientLight(0xffffff, 1.0));
            const light = new THREE.DirectionalLight(0xffffff, 0.8);
            light.position.set(10, 20, 10);
            window.lushanAPI.scene.add(light);

            const addM = (x, z, s, c) =&gt; {
              const m = new THREE.Mesh(new THREE.ConeGeometry(5, 10, 4), new THREE.MeshPhongMaterial({ color: c, flatShading: true }));
              m.position.set(x, 0, z);
              m.scale.set(s.x, s.y, s.z);
              window.lushanAPI.scene.add(m);
            };
            addM(0, 0, {x: 1.8, y: 1.5, z: 0.6}, 0x27ae60);
            addM(-8, -2, {x: 1.2, y: 0.8, z: 0.4}, 0x2ecc71);
            addM(8, -5, {x: 2.5, y: 1.8, z: 0.8}, 0x1e8449);

            const ground = new THREE.Mesh(new THREE.PlaneGeometry(500, 500), new THREE.MeshPhongMaterial({ color: 0xdcdde1 }));
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -0.5;
            window.lushanAPI.scene.add(ground);

            window.lushanAPI.controls = new THREE.OrbitControls(window.lushanAPI.camera, window.lushanAPI.renderer.domElement);
            window.lushanAPI.controls.enableDamping = true;
            
            const animate = () =&gt; {
              if (!window.lushanAPI.renderer) return;
              window.lushanAPI.animationId = requestAnimationFrame(animate);
              window.lushanAPI.controls.update();
              window.lushanAPI.renderer.render(window.lushanAPI.scene, window.lushanAPI.camera);
            };
            animate();
            console.log(&quot;DEBUG: Lushan Renderer initialized.&quot;);
          }
        };

        const triggerInit = () =&gt; {
          console.log(&quot;DEBUG: showPage Trigger detected.&quot;);
          // 这里使用 requestAnimationFrame 确保在浏览器下一帧容器已在 DOM 中挂载
          requestAnimationFrame(() =&gt; {
            setTimeout(window.lushanAPI.init, 300);
          });
        };

        document.addEventListener('pageShow', (e) =&gt; {
          console.log(&quot;DEBUG: pageShow event received, id =&quot;, e.detail.pageId);
          if (e.detail.pageId == 7) {
            triggerInit();
          } else {
            window.lushanAPI.destroy();
          }
        });

        // 强行挂载全局 Hook
        const originalShowPage = window.showPage;
        window.showPage = function(id) {
          if (originalShowPage) originalShowPage(id);
          if (id == 7) triggerInit();
          else if(window.lushanAPI) window.lushanAPI.destroy();
        };
      })();
    &lt;/script&gt;
  &lt;/div&gt;
&lt;/template&gt;

        &lt;div style=&quot;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#999;font-size:14px;&quot;&gt;正在构建 3D 几何模型...&lt;/div&gt;

      &lt;div class=&quot;text-xl text-gray-700 max-w-sm&quot;&gt;
        &lt;p class=&quot;font-bold text-blue-600 mb-2&quot;&gt;🐕 几何小狗互动：&lt;/p&gt;
        &lt;p class=&quot;mb-2&quot;&gt;这是一个由&lt;b&gt;长方体、正方体和球体&lt;/b&gt;组成的 3D 小狗模型。&lt;/p&gt;
        &lt;p class=&quot;text-lg&quot;&gt;请尝试旋转它，观察从&ldquo;前面&rdquo;、&ldquo;上面&rdquo;和&ldquo;侧面&rdquo;看去，它的身体部位分别变成了什么形状？&lt;/p&gt;

    &lt;script&gt;
      (function() {
        let scene, camera, renderer, controls, container, frameId;
        let isInitialized = false;

        const initDog3D = () =&gt; {
          if (isInitialized) return;
          container = document.getElementById('dog-3d-container');
          if (!container || !container.offsetParent) return;

          const w = container.clientWidth;
          const h = container.clientHeight;
          if (w &lt;= 0 || h &lt;= 0) return;

          try {
            isInitialized = true;
            container.innerHTML = '';

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xfdfdfd);

            camera = new THREE.PerspectiveCamera(40, w / h, 0.1, 1000);
            camera.position.set(8, 6, 10);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(w, h);
            renderer.setPixelRatio(window.devicePixelRatio || 1);
            container.appendChild(renderer.domElement);

            // 光照
            const ambient = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambient);
            const directional = new THREE.DirectionalLight(0xffffff, 0.6);
            directional.position.set(5, 10, 7);
            scene.add(directional);

            // 几何小狗组
            const dogGroup = new THREE.Group();
            
            // 身体 - 长方体
            const bodyGeo = new THREE.BoxGeometry(3, 2, 1.5);
            const bodyMat = new THREE.MeshPhongMaterial({ color: 0xe67e22 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            dogGroup.add(body);

            // 头部 - 正方体
            const headGeo = new THREE.BoxGeometry(1.5, 1.5, 1.5);
            const headMat = new THREE.MeshPhongMaterial({ color: 0xd35400 });
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.set(2, 1, 0);
            dogGroup.add(head);

            // 鼻子 - 球体
            const noseGeo = new THREE.SphereGeometry(0.2, 16, 16);
            const noseMat = new THREE.MeshPhongMaterial({ color: 0x2c3e50 });
            const nose = new THREE.Mesh(noseGeo, noseMat);
            nose.position.set(2.8, 1, 0);
            dogGroup.add(nose);

            // 耳朵 - 两个长条
            const earGeo = new THREE.BoxGeometry(0.3, 1, 0.6);
            const earMat = new THREE.MeshPhongMaterial({ color: 0x924a0d });
            const earL = new THREE.Mesh(earGeo, earMat);
            earL.position.set(2, 1.8, 0.6);
            dogGroup.add(earL);
            const earR = earL.clone();
            earR.position.set(2, 1.8, -0.6);
            dogGroup.add(earR);

            // 腿 - 四个柱子
            const legGeo = new THREE.BoxGeometry(0.5, 1.5, 0.5);
            const legPos = [
              {x: -1, y: -1.5, z: 0.5}, {x: 1, y: -1.5, z: 0.5},
              {x: -1, y: -1.5, z: -0.5}, {x: 1, y: -1.5, z: -0.5}
            ];
            legPos.forEach(p =&gt; {
              const leg = new THREE.Mesh(legGeo, bodyMat);
              leg.position.set(p.x, p.y, p.z);
              dogGroup.add(leg);
            });

            // 尾巴
            const tailGeo = new THREE.BoxGeometry(1, 0.2, 0.2);
            const tail = new THREE.Mesh(tailGeo, bodyMat);
            tail.position.set(-2, 0.5, 0);
            tail.rotation.z = Math.PI/4;
            dogGroup.add(tail);

            scene.add(dogGroup);

            // 地面网格
            const grid = new THREE.GridHelper(20, 10, 0xdddddd, 0xeeeeee);
            grid.position.y = -2.25;
            scene.add(grid);

            if (typeof THREE.OrbitControls !== 'undefined') {
              controls = new THREE.OrbitControls(camera, renderer.domElement);
              controls.enableDamping = true;
              controls.autoRotate = false;
            }

            // 视角切换逻辑
            window.rotateDogTo = function(view) {
              if (!camera || !controls) return;
              
              let targetPos = new THREE.Vector3();
              let upVector = new THREE.Vector3(0, 1, 0); // 默认向上向量为 Y
              
              switch(view) {
                case 'front': 
                  targetPos.set(10, 0, 0); 
                  break; 
                case 'top': 
                  // 俯视：相机在 Y 轴高处，视线向下
                  targetPos.set(0, 12, 0); 
                  // 修正对齐：俯视时，让小狗的头朝向屏幕上方（即让相机的前方向量与小狗的前方一致）
                  upVector.set(-1, 0, 0); 
                  break;
                case 'side': 
                  targetPos.set(0, 0, 10); 
                  break; 
              }
              
              // 使用 Anime.js 实现平滑过渡
              anime({
                targets: camera.position,
                x: targetPos.x,
                y: targetPos.y,
                z: targetPos.z,
                duration: 1000,
                easing: 'easeInOutQuad',
                update: function() {
                  camera.up.copy(upVector);
                  camera.lookAt(0, 0, 0);
                  controls.update();
                }
              });
            };

            const animate = () =&gt; {
              frameId = requestAnimationFrame(animate);
              if (controls) controls.update();
              if (renderer &amp;&amp; scene &amp;&amp; camera) renderer.render(scene, camera);
            };
            animate();
          } catch (err) {
            console.error('Real 3D Dog Error:', err);
          }
        };

        document.addEventListener('pageShow', (e) =&gt; {
          if (e.detail.pageId == 9) setTimeout(initDog3D, 300);
        });
        window.addEventListener('load', () =&gt; setTimeout(initDog3D, 1500));
        if (window.ResizeObserver) {
          const ro = new ResizeObserver(() =&gt; { if (!isInitialized) initDog3D(); });
          ro.observe(document.body);
        }
      })();
    &lt;/script&gt;

            color: 0x3498DB,
            transparent: true,
            opacity: 0.95
          });
          const mesh = new THREE.Mesh(geometry, material);
          mesh.position.set(x, y, z);
          
          const edges = new THREE.EdgesGeometry(geometry);
          const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0xffffff, linewidth: 2 }));
          mesh.add(line);
          scene.add(mesh);
        };

        const animate = () =&gt; {
          frameId = requestAnimationFrame(animate);
          if (controls) controls.update();
          if (renderer &amp;&amp; scene &amp;&amp; camera) renderer.render(scene, camera);
        };
        
        const initP7 = () =&gt; {
          if (isInitialized) return;
          container = document.getElementById('box-3d-container');
          if (!container || !container.offsetParent) return;

          const w = container.clientWidth;
          const h = container.clientHeight;
          if (w &lt;= 0 || h &lt;= 0) return;

          try {
            isInitialized = true;
            container.innerHTML = '';

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xfdfdfd);

            camera = new THREE.PerspectiveCamera(45, w / h, 0.1, 1000);
            camera.position.set(10, 8, 12);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(w, h);
            renderer.setPixelRatio(window.devicePixelRatio || 1);
            container.appendChild(renderer.domElement);

            const ambient = new THREE.AmbientLight(0xffffff, 0.9);
            scene.add(ambient);
            const sun = new THREE.DirectionalLight(0xffffff, 0.6);
            sun.position.set(10, 20, 10);
            scene.add(sun);

            // 模型构造：满足用户图片所示的 L 型立体结构
            // 底部 1x2，上方左侧叠加一块
            addBlock(0, -1, 0);   // 底部左侧
            addBlock(0, 1, 0);    // 顶部左侧（叠加）
            addBlock(2, -1, 0);   // 底部右侧
            
            const grid = new THREE.GridHelper(20, 10, 0xcccccc, 0xeeeeee);
            grid.position.y = -2.1;
            scene.add(grid);

            if (typeof THREE.OrbitControls !== 'undefined') {
              controls = new THREE.OrbitControls(camera, renderer.domElement);
              controls.enableDamping = true;
            }

            // 修正初始视角：匹配用户参考图的 3/4 俯视视角
            camera.position.set(15, 12, 18);
            camera.lookAt(1, 0, 0);
            if (controls) controls.target.set(1, 0, 0);
            if (controls) controls.update();
            
            // 视角联动逻辑
            window.rotateToView = function(viewType) {
              if (!camera || !controls) return;
              let targetPos = new THREE.Vector3();
              let upVector = new THREE.Vector3(0, 1, 0);

              switch(viewType) {
                case 'front': 
                  targetPos.set(1, 0, 20); 
                  break;
                case 'top': 
                  targetPos.set(1, 20, 0); 
                  upVector.set(0, 0, -1); 
                  break;
                case 'side': 
                  // 修正：从&ldquo;左边&rdquo;看应当将相机移至 X 轴负方向，以观察堆叠的长方形
                  targetPos.set(-20, 0, 0); 
                  break;
              }

              anime({
                targets: camera.position,
                x: targetPos.x,
                y: targetPos.y,
                z: targetPos.z,
                duration: 1200,
                easing: 'easeInOutQuad',
                update: function() {
                  camera.up.copy(upVector);
                  camera.lookAt(1, 0, 0);
                  controls.target.set(1, 0, 0);
                  controls.update();
                }
              });
            };

            animate();
          } catch (err) {
            console.error('P7 Error:', err);
            isInitialized = false;
          }
        };

        window.handleAnsClick = function(idx, viewType) {
          // 显示文本答案
          const contents = document.querySelectorAll('.ans-content');
          if (contents[idx]) {
            contents[idx].classList.toggle('hidden');
          }
          // 联动 3D 视角
          window.rotateToView(viewType);
        };

        window.toggleAns = function(idx) {
          const contents = document.querySelectorAll('.ans-content');
          if (contents[idx]) {
            contents[idx].classList.toggle('hidden');
          }
        };

        // 多重保底触发
        document.addEventListener('pageShow', (e) =&gt; {
          if (e.detail.pageId == 10) {
            setTimeout(initP7, 300);
            setTimeout(initP7, 1000);
          }
        });

        window.addEventListener('load', () =&gt; setTimeout(initP7, 1500));
        
        // 监控容器大小变化（框架展开动画结束后触发）
        if (window.ResizeObserver) {
          const ro = new ResizeObserver(() =&gt; {
            if (!isInitialized) initP7();
          });
          ro.observe(document.body);
        }
      })();
    &lt;/script&gt;
  &lt;/div&gt;
&lt;/template&gt;

  &lt;div class=&quot;page-container&quot;&gt;

    &lt;script src=&quot;https://metis-online.fbcontent.cn/metis-misc/RzWcgrRY7zuXErSSLsDmh0.js&quot;&gt;&lt;/script&gt;

    &lt;script&gt;
      (function() {
        let scene, camera, renderer, controls, container;
        let blocks = [];
        const GRID_SIZE = 2;

        function init() {
          container = document.getElementById('canvas3d');
          if (!container || container.querySelector('canvas')) return;

          scene = new THREE.Scene();
          scene.background = new THREE.Color(0xf8f9f9);
          
          const rect = container.getBoundingClientRect();
          camera = new THREE.PerspectiveCamera(45, rect.width / rect.height, 0.1, 1000);
          camera.position.set(10, 10, 10);
          
          renderer = new THREE.WebGLRenderer({ antialias: true });
          renderer.setSize(rect.width, rect.height);
          renderer.setPixelRatio(window.devicePixelRatio);
          container.appendChild(renderer.domElement);
          
          const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
          scene.add(ambientLight);
          const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
          dirLight.position.set(10, 15, 10);
          scene.add(dirLight);

          const grid = new THREE.GridHelper(10, 5, 0xcccccc, 0xeeeeee);
          grid.position.y = -GRID_SIZE/2;
          scene.add(grid);

          if (typeof THREE.OrbitControls !== 'undefined') {
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
          }
          
          animate();
          window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
          if (!container || !camera || !renderer) return;
          const rect = container.getBoundingClientRect();
          camera.aspect = rect.width / rect.height;
          camera.updateProjectionMatrix();
          renderer.setSize(rect.width, rect.height);
        }

        window.addBlock = function() {
          if (blocks.length &gt;= 8) return;
          const geo = new THREE.BoxGeometry(GRID_SIZE, GRID_SIZE, GRID_SIZE);
          const mat = new THREE.MeshPhongMaterial({ color: 0x3498DB, transparent: true, opacity: 0.9 });
          const mesh = new THREE.Mesh(geo, mat);
          
          const index = blocks.length;
          mesh.position.set((index % 2) * GRID_SIZE, Math.floor(index/4) * GRID_SIZE, (Math.floor(index/2) % 2) * GRID_SIZE);
          
          scene.add(mesh);
          blocks.push(mesh);
          const countEl = document.getElementById('block-count');
          if (countEl) countEl.innerText = blocks.length;
          
          mesh.scale.set(0,0,0);
          anime({ targets: mesh.scale, x: 1, y: 1, z: 1, duration: 500, easing: 'easeOutElastic' });
          saveState();
        };

        window.clearStage = function() {
          blocks.forEach(b =&gt; scene.remove(b));
          blocks = [];
          const countEl = document.getElementById('block-count');
          if (countEl) countEl.innerText = 0;
          saveState();
        };

        window.setFixedView = function(type) {
          document.querySelectorAll('.v-btn').forEach(b =&gt; b.classList.remove('active'));
          const btn = document.getElementById('btn-' + type);
          if (btn) btn.classList.add('active');

          let pos;
          if (type === 'front') pos = { x: 0, y: 0, z: 20 };
          else if (type === 'top') pos = { x: 0, y: 20, z: 0 };
          else if (type === 'side') pos = { x: 20, y: 0, z: 0 };
          else return;

          if (camera &amp;&amp; controls) {
            anime({
              targets: camera.position,
              x: pos.x, y: pos.y, z: pos.z,
              duration: 1000,
              easing: 'easeInOutQuad',
              update: () =&gt; controls.update()
            });
          }
        };

        function animate() {
          requestAnimationFrame(animate);
          if (controls) controls.update();
          if (renderer &amp;&amp; scene &amp;&amp; camera) renderer.render(scene, camera);
        }

        function saveState() {
          const positions = blocks.map(b =&gt; ({x: b.position.x, y: b.position.y, z: b.position.z}));
          window.parent.postMessage({ type: 'saveState', state: { blockPos: positions } }, '*');
        }

        window.addEventListener('message', function(e) {
          if (e.data &amp;&amp; e.data.type === 'restoreState' &amp;&amp; e.data.state &amp;&amp; e.data.state.blockPos) {
            if (scene) {
              blocks.forEach(b =&gt; scene.remove(b));
              blocks = [];
              e.data.state.blockPos.forEach(p =&gt; {
                const geo = new THREE.BoxGeometry(GRID_SIZE, GRID_SIZE, GRID_SIZE);
                const mat = new THREE.MeshPhongMaterial({ color: 0x3498DB });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(p.x, p.y, p.z);
                scene.add(mesh);
                blocks.push(mesh);
              });
              const countEl = document.getElementById('block-count');
              if (countEl) countEl.innerText = blocks.length;
            }
          }
        });

        document.addEventListener('visibilitychange', () =&gt; {
          if (document.visibilityState === 'visible' &amp;&amp; !renderer) init();
        });

        setTimeout(init, 150);
      })();
    &lt;/script&gt;
  &lt;/div&gt;
&lt;/template&gt;

&lt;template class=&quot;page-data&quot; data-id=&quot;14&quot; data-name=&quot;挑战：语数连连看&quot;&gt;
  &lt;style&gt;
    .game-area { display: flex; justify-content: space-between; position: relative; height: 350px; }
    .node-list { width: 200px; display: flex; flex-direction: column; justify-content: space-between; }
    .game-node {
      padding: 15px; background: white; border: 2px solid #ccc; border-radius: 10px;
      text-align: center; cursor: pointer; position: relative; transition: all 0.3s;
      z-index: 10;
    }
    .game-node.selected { border-color: #3498DB; box-shadow: 0 0 10px rgba(52,152,219,0.5); }
    .game-node.correct { border-color: #27AE60; background: #E8F8F5; color: #27AE60; }
    #game-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
  &lt;/style&gt;
  &lt;div class=&quot;page-container&quot;&gt;
    &lt;h2 class=&quot;page-title&quot;&gt;第一关：诗意与数理连连看&lt;/h2&gt;
    &lt;p class=&quot;text-center mb-6 text-gray-500&quot;&gt;点击左侧诗句，再点击右侧对应的数学观察方式。&lt;/p&gt;
    &lt;div class=&quot;game-area&quot;&gt;
      &lt;canvas id=&quot;game-canvas&quot;&gt;&lt;/canvas&gt;
      &lt;div class=&quot;node-list&quot;&gt;
        &lt;div class=&quot;game-node&quot; data-type=&quot;left&quot; data-id=&quot;1&quot; onclick=&quot;selectNode(this)&quot;&gt;横看成岭&lt;/div&gt;
        &lt;div class=&quot;game-node&quot; data-type=&quot;left&quot; data-id=&quot;2&quot; onclick=&quot;selectNode(this)&quot;&gt;侧看成峰&lt;/div&gt;
        &lt;div class=&quot;game-node&quot; data-type=&quot;left&quot; data-id=&quot;3&quot; onclick=&quot;selectNode(this)&quot;&gt;远近高低&lt;/div&gt;
        &lt;div class=&quot;game-node&quot; data-type=&quot;left&quot; data-id=&quot;4&quot; onclick=&quot;selectNode(this)&quot;&gt;各不同&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;node-list&quot;&gt;
        &lt;div class=&quot;game-node&quot; data-type=&quot;right&quot; data-id=&quot;3&quot; onclick=&quot;selectNode(this)&quot;&gt;不同距离/高度观察&lt;/div&gt;
        &lt;div class=&quot;game-node&quot; data-type=&quot;right&quot; data-id=&quot;1&quot; onclick=&quot;selectNode(this)&quot;&gt;从前面观察&lt;/div&gt;
        &lt;div class=&quot;game-node&quot; data-type=&quot;right&quot; data-id=&quot;4&quot; onclick=&quot;selectNode(this)&quot;&gt;观察位置不同视图不同&lt;/div&gt;
        &lt;div class=&quot;game-node&quot; data-type=&quot;right&quot; data-id=&quot;2&quot; onclick=&quot;selectNode(this)&quot;&gt;从左面/左边观察&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;script&gt;
    let selectedNode = null;
    let matched = [];
    let isDrawing = false;
    let startX, startY;
    
    // 获取 canvas 元素
    const getGameCanvas = () =&gt; document.getElementById('game-canvas');

    function selectNode(el) {
      if (el.classList.contains('correct')) return;
      const canvas = getGameCanvas();
      const ctx = canvas.getContext('2d');
      const rect = el.getBoundingClientRect();
      const cRect = canvas.getBoundingClientRect();

      if (!isDrawing) {
        isDrawing = true;
        selectedNode = el;
        el.classList.add('selected');
        // 记录起始点：如果是左侧节点从右边出，右侧节点从左边出
        startX = (el.dataset.type === 'left') ? rect.right - cRect.left : rect.left - cRect.left;
        startY = rect.top + rect.height / 2 - cRect.top;
      } else {
        // 连线逻辑
        if (selectedNode.dataset.type !== el.dataset.type) {
          if (selectedNode.dataset.id === el.dataset.id) {
            el.classList.add('correct');
            selectedNode.classList.add('correct');
            matched.push({ l: selectedNode.dataset.id, r: el.dataset.id, type: selectedNode.dataset.type });
            if (window.anime) window.anime({ targets: el, scale: [1, 1.1, 1], duration: 300 });
            checkWin();
          } else {
            if (window.anime) window.anime({ targets: el, translateX: [0, -10, 10, 0], duration: 400 });
          }
        }
        isDrawing = false;
        if(selectedNode) selectedNode.classList.remove('selected');
        selectedNode = null;
        drawLines();
      }
    }

    // 监听整个 game-area 的移动，因为 canvas 设置了 pointer-events: none
    document.addEventListener('mousemove', (e) =&gt; {
      if (!isDrawing) return;
      const canvas = getGameCanvas();
      if(!canvas) return;
      const cRect = canvas.getBoundingClientRect();
      
      // 只有在游戏区域内才绘制实时线
      if (e.clientX &lt; cRect.left || e.clientX &gt; cRect.right || e.clientY &lt; cRect.top || e.clientY &gt; cRect.bottom) return;

      drawLines();
      const ctx = canvas.getContext('2d');
      ctx.beginPath();
      ctx.setLineDash([5, 5]);
      ctx.moveTo(startX, startY);
      ctx.lineTo(e.clientX - cRect.left, e.clientY - cRect.top);
      ctx.strokeStyle = '#3498DB';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.setLineDash([]);
    });

    function drawLines() {
      const canvas = getGameCanvas();
      if(!canvas) return;
      const ctx = canvas.getContext('2d');
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.lineCap = 'round';
      
      const cRect = canvas.getBoundingClientRect();
      matched.forEach(pair =&gt; {
        const lNode = document.querySelector(`[data-type=&quot;left&quot;][data-id=&quot;${pair.l}&quot;]`);
        const rNode = document.querySelector(`[data-type=&quot;right&quot;][data-id=&quot;${pair.r}&quot;]`);
        if(!lNode || !rNode) return;
        const lRect = lNode.getBoundingClientRect();
        const rRect = rNode.getBoundingClientRect();
        
        ctx.beginPath();
        ctx.moveTo(lRect.right - cRect.left, lRect.top + lRect.height / 2 - cRect.top);
        ctx.lineTo(rRect.left - cRect.left, rRect.top + rRect.height / 2 - cRect.top);
        ctx.strokeStyle = '#27AE60'; 
        ctx.lineWidth = 4;
        ctx.stroke();
      });
    }

    function checkWin() {
      if (matched.length === 4) {
        window.parent.postMessage({ type: 'saveState', state: { matched } }, '*');
      }
    }

      window.addEventListener('message', e =&gt; {
        if (e.data &amp;&amp; e.data.type === 'restoreState' &amp;&amp; e.data.state &amp;&amp; e.data.state.matched) {

          matched.forEach(pair =&gt; {

            document.querySelector(`[data-type=&quot;right&quot;][data-id=&quot;${pair.r}&quot;]`).classList.add('correct');
          });
          setTimeout(drawLines, 100);
        }
      });

    }

    function openFeixiangTeacher(event) {
        const isMobile = getIsMobile()

        // 判断是否为移动端浏览器
        if (isMobile) {

            return
        }
        window.open('https://www.feixianglaoshi.com', '_blank')
    }


    // ==================== 埋点相关代码 ====================

    /**
     * 页面停留时长统计
     */
    (function () {
        let startTime = null
        let totalTime = 0
        let reportTimer = null // 防抖定时器

        // 开始计时
        function startTimer() {
            if (!startTime) {
                startTime = Date.now()
                console.log('[埋点] 开始计时')
            }
        }

        // 停止计时并累加时长
        function stopTimer() {
            if (startTime) {
                totalTime += Date.now() - startTime
                startTime = null
                console.log('[埋点] 停止计时，累计时长:', Math.floor(totalTime / 1000), '秒')
            }
        }

        // 检查页面是否真正可见
        function isPageVisible() {
            // 检查 document.hidden
            if (document.hidden) {
                return false
            }

            // 检查 document.visibilityState
            if (document.visibilityState && document.visibilityState !== 'visible') {
                return false
            }

            // 检查窗口是否有焦点
            if (!document.hasFocus()) {
                return false
            }

            return true
        }

        // 上报停留时长（带防抖）
        function reportStayTime(eventType, immediate = false) {
            stopTimer()

            // 清除之前的定时器
            if (reportTimer) {
                clearTimeout(reportTimer)
                reportTimer = null
            }

            // 如果是立即上报（如页面卸载），不使用防抖
            if (immediate) {
                doReport(eventType)
                return
            }

            // 使用防抖，避免短时间内多次上报
            // 100ms 内如果有多个事件触发，只上报最后一次
            reportTimer = setTimeout(function () {
                doReport(eventType)
                reportTimer = null
            }, 100)
        }

        // 实际执行上报
        function doReport(eventType) {
            if (window.frog && totalTime > 0) {
                const serverData = window.__SERVER_DATA__ || {}
                const chatId = serverData.watermarkChatId
                window.frog.add({
                    url: '/time/HtmlPage/enter',
                    eventId: 42818,
                    customExtend: {
                        chat_id: chatId,
                        use_time: Math.floor(totalTime / 1000), // 转换为秒
                    },
                    duration: Math.floor(totalTime / 1000), // 转换为秒,
                    currentPage: 'HtmlPage',
                    eventAction: 'time',
                    eventName: 'enter'
                })
                console.log(`[埋点] 页面停留时长上报 (${eventType}):`, Math.floor(totalTime / 1000), '秒')

                // 上报后重置累计时长，为下次统计做准备
                totalTime = 0
            }
        }

        // 清理函数：移除所有事件监听器
        function cleanup() {
            console.log('[埋点] 清理计时器资源')

            // 清除防抖定时器
            if (reportTimer) {
                clearTimeout(reportTimer)
                reportTimer = null
            }

            // 移除事件监听器
            document.removeEventListener('visibilitychange', handleVisibilityChange)
            window.removeEventListener('blur', handleBlur)
            window.removeEventListener('focus', handleFocus)
            window.removeEventListener('beforeunload', handleBeforeUnload)
            window.removeEventListener('pagehide', handlePageHide)

            // 重置变量
            startTime = null
            totalTime = 0
        }

        // 事件处理函数（需要命名以便移除）
        function handleVisibilityChange() {
            if (document.hidden) {
                // 页面不可见，停止计时并上报
                console.log('[埋点] visibilitychange - 页面隐藏')
                reportStayTime('visibilitychange')
            } else {
                // 页面可见，开始新的计时
                console.log('[埋点] visibilitychange - 页面显示，开始新的计时')
                startTimer()
            }
        }

        function handleBlur() {
            // 窗口失去焦点，停止计时并上报
            console.log('[埋点] blur - 窗口失去焦点')
            reportStayTime('blur')
        }

        function handleFocus() {
            // 窗口获得焦点，开始新的计时
            console.log('[埋点] focus - 窗口获得焦点，开始新的计时')
            startTimer()
        }

        function handleBeforeUnload() {
            // 页面卸载前立即上报（不使用防抖）
            console.log('[埋点] beforeunload - 页面即将卸载')
            reportStayTime('beforeunload', true)
            cleanup()
        }

        function handlePageHide() {
            // 页面隐藏时立即上报（iOS Safari 更可靠，不使用防抖）
            console.log('[埋点] pagehide - 页面隐藏')
            reportStayTime('pagehide', true)
        }

        function handleDOMContentLoaded() {
            if (isPageVisible()) {
                startTimer()
            }
        }

        // 监听页面可见性变化
        document.addEventListener('visibilitychange', handleVisibilityChange)

        // 监听窗口失去/获得焦点
        window.addEventListener('blur', handleBlur)
        window.addEventListener('focus', handleFocus)

        // 页面加载完成后开始计时
        if (document.readyState === 'loading') {
            window.addEventListener('DOMContentLoaded', handleDOMContentLoaded)
        } else {
            if (isPageVisible()) {
                startTimer()
            }
        }

        // 页面卸载时上报
        window.addEventListener('beforeunload', handleBeforeUnload)

        // 兼容性：监听 pagehide 事件（iOS Safari 更可靠）
        window.addEventListener('pagehide', handlePageHide)
    })()

    // 绑定点击事件
    document.addEventListener('DOMContentLoaded', function () {
        // 绑定 Logo 点击埋点和跳转功能
        const logoElement = document.querySelector('.left-watermark-content')
        if (logoElement) {
            logoElement.addEventListener('click', function (event) {
                trackLogoClick(event)
                openFeixiangTeacher(event)
            })
        }

        // 绑定立即体验按钮点击埋点和跳转功能
        const startButton = document.querySelector('.jump-button')
        if (startButton) {
            startButton.addEventListener('click', function (event) {
                trackStartButtonClick(event)
                openFeixiangTeacher(event)
            })
        }

        // 绑定水印覆盖层点击（整体区域）
        const watermarkOverlay = document.querySelector('.watermark-overlay')
        if (watermarkOverlay) {
            watermarkOverlay.addEventListener('click', function (event) {
                // 如果点击的不是 logo 或按钮，则触发跳转
                const target = event.target
                const isLogo = target.closest('.left-watermark-content')
                const isButton = target.closest('.jump-button')

                if (!isLogo && !isButton) {
                    openFeixiangTeacher(event)
                }
            })
        }
    })

    // ==================== 原有功能代码 ====================

    function adjustRem() {
        const pcBaseWidth = 375 // 设计稿
        const width = document.documentElement.clientWidth
        document.documentElement.style.fontSize = `${(width / pcBaseWidth * 100).toFixed(2)}px`
    }


    // 移动端检测和按钮隐藏逻辑
    function checkAndHideButtonOnMobile() {
        const isMobile = getIsMobile()
        if (isMobile) {
            adjustRem()
        }
        const jumpButton = document.querySelector('.right-watermark-content .jump-button');
        const iframeContainer = document.querySelector('.iframe-container');

        if (isMobile && jumpButton) {
            jumpButton.style.display = 'none';
        } else {
            jumpButton.style.display = 'flex'
        }

        // 移动端时给iframe-container添加类名，否则移除类名
        if (iframeContainer) {
            if (isMobile) {
                iframeContainer.classList.add('mobile');
            } else {
                iframeContainer.classList.remove('mobile');
            }
        }
    }


    function handleResize() {
        // 响应式处理：重新检测移动端并处理按钮显示/隐藏
        checkAndHideButtonOnMobile();

        // 在窗口大小变化时，重新应用移动端相关的逻辑
        const isMobile = getIsMobile()
        const watermarkOverlay = document.querySelector('.watermark-overlay');
        const iframeContainer = document.querySelector('.iframe-container');

        // 根据当前设备类型调整水印覆盖层的点击行为
        if (watermarkOverlay) {
            if (isMobile) {
                // 移动端：移除点击事件或设置为空函数
                watermarkOverlay.onclick = function () {
                    // 移动端不执行跳转
                    return;
                };
            } else {
                // 桌面端：恢复正常的点击跳转功能
                watermarkOverlay.onclick = openFeixiangTeacher;
            }
        }

        // 确保在resize时也能正确添加或移除mobile类
        if (iframeContainer) {
            if (isMobile) {
                iframeContainer.classList.add('mobile');
            } else {
                iframeContainer.classList.remove('mobile');
            }
        }
    }

    // 防止iframe内容溢出
    window.addEventListener('resize', handleResize);

    // 页面加载完成后执行移动端检测
    document.addEventListener('DOMContentLoaded', checkAndHideButtonOnMobile);

    // 清理所有事件绑定的函数
    function clearAllEvents() {
        // 清除 resize 事件监听器
        window.removeEventListener('resize', handleResize);

        // 清除 DOMContentLoaded 事件监听器
        document.removeEventListener('DOMContentLoaded', checkAndHideButtonOnMobile);
    }

    // 页面卸载时自动清理事件（可选）
    window.addEventListener('beforeunload', clearAllEvents);
